<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="connect-src 'self'">
  <meta name="theme-color" content="#fbf1e6">
  <link rel="icon" href="data:,">
  <title>扭蛋黄</title>
</head>
<body>
<main id="machine" class="surface" aria-label="扭蛋黄展览">
  <div class="fit" id="fit">
    <div class="world" id="world" data-view="overview">
      <div class="room" aria-hidden="true"><div class="floor"></div><div class="ground-shadow"></div></div>
      <section class="cabinet" id="cabinet" aria-label="红色扭蛋机">
        <div class="cabinet-art" id="cabinet-art">
          <svg class="cabinet-shell" viewBox="0 0 560 780" aria-hidden="true">
            <path fill="#e4edf0" d="M58 140H502V536H58Z"/>
            <path fill="none" stroke="#111113" stroke-width="12" d="M60 153V533M500 153V533"/>
            <path fill="#ff2f27" stroke="#111113" stroke-width="13" stroke-linejoin="round"
              d="M60 513H500L550 726V761Q550 774 537 774H23Q10 774 10 761V726Z"/>
            <path fill="none" stroke="#111113" stroke-width="7" d="M10 731H550"/>
            <path fill="#e62b25" d="M17 735H543V760Q543 767 537 767H23Q17 767 17 760Z"/>
          </svg>
          <div id="playfield" class="playfield" aria-label="玻璃主仓"></div>
          <div class="lid-gap" aria-hidden="true"></div>
          <div id="collector" class="collector" role="group" aria-label="滞留区"></div>
          <div class="chamber-floor" aria-hidden="true"></div>
          <div id="retention-gate" class="retention-gate" aria-hidden="true"></div>
          <div id="tray-trim" class="tray-trim" aria-hidden="true"></div>
          <div id="machine-commands" class="machine-commands" inert>
            <button id="lid" class="lid-hit" type="button" aria-label="按住顶盖投放" title="按住顶盖投放" aria-pressed="false">
              <svg viewBox="0 0 560 165" aria-hidden="true">
                <path fill="#ff3027" stroke="#111113" stroke-width="12" stroke-linejoin="round"
                  d="M60 153V77Q60 69 69 66L280 7L491 66Q500 69 500 77V153Z"/>
                <path fill="none" stroke="#111113" stroke-width="6" d="M60 115H500"/>
              </svg>
            </button>
            <button id="draw" class="lever" type="button" aria-keyshortcuts="ArrowDown" aria-label="下拉摇杆" title="下拉摇杆">
              <span class="lever-track" aria-hidden="true"><span class="lever-base"></span><span class="lever-arm"><span class="lever-knob"></span></span></span>
            </button>
            <button id="take" class="take" type="button" data-native data-hand aria-label="带走!" disabled>
              <img src="%BASE_URL%art/take-dots.svg" alt="">
            </button>
          </div>
        </div>
        <button id="enter-machine" class="scene-entry" type="button" data-native data-hand aria-label="进入扭蛋机"></button>
      </section>
      <section class="poster-wall" id="poster-wall" aria-label="海报墙">
        <div class="poster-viewport" id="poster-viewport" tabindex="0" inert><div class="poster-grid"></div></div>
        <button id="enter-wall" class="scene-entry" type="button" data-native data-hand aria-label="进入海报墙"></button>
      </section>
    </div>
  </div>
  <button id="back" class="icon-button back" type="button" data-native data-hand aria-label="返回总览" title="返回总览" hidden>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><path d="m12 5-7 7 7 7M5 12h14"/></svg>
  </button>
  <div class="operator-controls" data-native>
    <button id="camera-toggle" class="icon-button" data-hand type="button" aria-label="启用摄像头" title="启用摄像头" aria-pressed="false" disabled>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="5.5" width="18" height="13" rx="2"/><circle cx="12" cy="12" r="3"/></svg>
    </button>
    <button id="help" class="icon-button help" type="button" data-hand aria-label="操作说明" title="操作说明">?</button>
    <details id="debug">
      <summary class="icon-button" aria-label="调试设置" title="调试设置">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/><circle cx="8" cy="6" r="2" fill="#fff9ee"/><circle cx="16" cy="12" r="2" fill="#fff9ee"/><circle cx="11" cy="18" r="2" fill="#fff9ee"/></svg>
      </summary>
      <div class="debug-panel">
        <fieldset>
          <legend>手势校准</legend>
          <p id="hand-status">摄像头未启动。</p>
          <div id="hand-preview" class="hand-preview" hidden></div>
          <label for="hand-device">摄像头设备</label>
          <select id="hand-device"><option value="">系统默认</option></select>
          <button id="hand-reconnect" type="button" disabled>连接摄像头</button>
          <div id="hand-settings"></div>
          <label><input id="hand-mirror" type="checkbox" checked> 水平镜像</label>
        </fieldset>
        <fieldset><legend>物理</legend><div id="settings"></div></fieldset>
      </div>
    </details>
  </div>
  <p id="camera-status" role="status" class="sr-only" hidden></p>
  <p id="notice" class="notice" role="status" hidden></p>
  <div id="cursor" class="cursor" aria-hidden="true" hidden></div>
  <dialog id="souvenir" aria-label="纪念海报">
    <div id="poster-view" class="poster-view"></div>
    <div id="poster-colors" class="poster-colors" role="group" aria-label="海报底色" hidden></div>
    <p id="poster-message" class="poster-message" role="status" hidden></p>
    <div class="dialog-controls">
      <button id="close-card" type="button" data-native data-hand aria-label="关闭海报"><span aria-hidden="true">×</span></button>
      <button id="confirm-card" type="button" data-native data-hand hidden>生成海报</button>
      <a id="save-card" data-native data-hand download="扭蛋黄-纪念海报.png" hidden>下载 PNG</a>
    </div>
  </dialog>
  <dialog id="instructions" aria-label="操作说明">
    <div class="instructions">
      <button id="close-help" type="button" data-native data-hand aria-label="关闭说明"><span aria-hidden="true">×</span></button>
      <h1>扭蛋黄</h1>
      <p>用鼠标或摄像头捏合选中扭蛋机和海报墙。</p>
      <p>按住红色顶盖投放 Emoji，抓起它们碰一碰。向下拉黄色摇杆抽取，再点「带走!」生成海报。</p>
      <p>把光标移到海报墙上缘或下缘浏览。点选海报可以放大。</p>
      <p id="archive-mode" role="status"></p>
    </div>
  </dialog>
</main>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
